# A simple load generator: 2 pods, each hammering the backend Service in a loop.
# Delete it to stop the load. (Lighter than Locust; good enough for a laptop.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: gen
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://backend/health; done"]
