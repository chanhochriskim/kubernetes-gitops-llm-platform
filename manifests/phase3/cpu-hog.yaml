# Phase 3, lesson 1: a process that wants 100% of a CPU, with a 100m (0.1 CPU) limit.
apiVersion: v1
kind: Pod
metadata:
  name: cpu-hog
spec:
  containers:
    - name: hog
      image: busybox:1.36
      command: ["sh", "-c", "while true; do :; done"]
      resources:
        requests:
          cpu: 50m
        limits:
          cpu: 100m
