# Phase 3, lesson 2: one pod per QoS class. Distinct sleep arguments make each process easy to find.
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort          # no requests, no limits
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3601"]
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable           # requests set, limits higher
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3602"]
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed          # requests equal limits for cpu and memory
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3603"]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 100m, memory: 64Mi}
