# An Argo CD Application: "watch deploy/app on branch main of this repo, and make the
# default namespace match it." Automated sync with self-heal and prune is on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chanhochriskim/kubernetes-gitops-llm-platform.git
    targetRevision: main
    path: deploy/app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true      # delete cluster objects that were removed from Git
      selfHeal: true   # undo manual changes made in the cluster
