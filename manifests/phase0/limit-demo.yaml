# Phase 0 preview of Phase 3: set requests/limits and read them back from the
# cgroup files on the node. Distinct sleep argument (3601) makes the process easy to find.
apiVersion: v1
kind: Pod
metadata:
  name: limit-demo
spec:
  containers:
    - name: sleeper
      image: busybox:1.36
      command: ["sleep", "3601"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
