# Throwaway pod used in Phase 0 to trace what happens when a pod is created
# and to find its process, namespaces, and cgroup on the node.
apiVersion: v1
kind: Pod
metadata:
  name: trace-me
  labels:
    app: trace-me
spec:
  containers:
    - name: sleeper
      image: busybox:1.36
      command: ["sleep", "3600"]
