# Local certificate chain:
#   selfsigned-issuer -> local-ca (a CA certificate we create) -> local-ca-issuer -> app.local certificate
# The private keys are generated by cert-manager and stored in Secrets in the cluster, not in Git.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: local-ca
  secretName: local-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca-issuer
spec:
  ca:
    secretName: local-ca-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-local
spec:
  secretName: app-local-tls
  dnsNames:
    - app.local
  issuerRef:
    name: local-ca-issuer
    kind: ClusterIssuer
