# Step 6: ConfigMap (plain settings) and a pod that reads settings two ways:
# as an environment variable and as a mounted file.
# The Secret "demo-secret" is NOT in Git on purpose; it is created from the command line.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
data:
  GREETING: "hello from the ConfigMap"
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - name: GREETING            # fixed at container start
          valueFrom:
            configMapKeyRef:
              name: demo-config
              key: GREETING
        - name: DEMO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-secret
              key: password
      volumeMounts:
        - name: cfg
          mountPath: /etc/demo      # each ConfigMap key becomes a file here
  volumes:
    - name: cfg
      configMap:
        name: demo-config
