# "If the request is for host app.local, send it to the frontend Service on port 80,
#  and serve HTTPS using the certificate in the Secret app-local-tls."
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.local
      secretName: app-local-tls      # made by cert-manager from the Certificate "app-local"
  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
